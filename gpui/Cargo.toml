[package]
name = "asp-gpui"
version = "0.1.0"
edition = "2021"
description = "Native gpui port of the ASP Context Desktop vault editor"

[[bin]]
name = "asp-gpui"
path = "src/main.rs"

[dependencies]
gpui = { path = "/home/chris/asp/.gpui-vendor/zed/crates/gpui", features = ["test-support"] }
gpui_platform = { path = "/home/chris/asp/.gpui-vendor/zed/crates/gpui_platform", features = ["font-kit", "wayland", "x11", "test-support"] }
gpui_wgpu = { path = "/home/chris/asp/.gpui-vendor/zed/crates/gpui_wgpu", features = ["font-kit"] }
image = "0.25.1"
asp-desktop-engine = { path = "../desktop/engine" }
asp-core = { path = "../crates/asp-core" }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Standalone workspace: gpui links system libs (vulkan/wayland/x11) and must stay
# out of the main asp workspace build graph, like desktop/src-tauri.
[workspace]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
