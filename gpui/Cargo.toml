[package]
name = "asp-gpui"
version = "0.1.0"
edition = "2021"
description = "Native gpui port of the ASP Context Desktop vault editor"

[[bin]]
name = "asp-gpui"
path = "src/main.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "5837e7ef50f65d6e041d19ba6543532a1d596e6b" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "5837e7ef50f65d6e041d19ba6543532a1d596e6b", features = ["font-kit", "wayland", "x11"] }
asp-desktop-engine = { path = "../desktop/engine" }
asp-core = { path = "../crates/asp-core" }
anyhow = "1"
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Standalone workspace: gpui links system libs (vulkan/wayland/x11) and must stay
# out of the main asp workspace build graph, like desktop/src-tauri.
[workspace]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
