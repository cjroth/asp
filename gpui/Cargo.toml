[package]
name = "aspgui"
version = "0.1.0"
edition = "2021"

[lib]
name = "aspgui"
path = "src/lib.rs"

[dependencies]
# Stock GPUI from Zed git — builds on macOS (Metal) and Linux out of the box.
gpui = { git = "https://github.com/zed-industries/zed", rev = "5837e7e" }
image = "0.25.1"
anyhow = "1"
hex = "0.4"
# asp backend — relative within this repo (HARD INVARIANT: all behavior via the engine).
asp-core = { path = "../crates/asp-core" }
asp-desktop-engine = { path = "../desktop/engine" }

# Platform glue: Metal on macOS/Windows (default features), X11+Wayland on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "5837e7e", features = ["x11", "wayland"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "5837e7e" }

# Headless-screenshot harness (bin/shoot, bin/smoke). Needs the patched GPUI
# (`zed-gpui-headless.patch` → Zed @ 5837e7e) and is gated so the default build
# of the app itself never touches it. See README for how to point GPUI at the
# patched checkout and build with `--features capture`.
[features]
capture = []

[profile.dev]
debug = 0
strip = "debuginfo"

[[bin]]
name = "aspgui"
path = "src/bin/aspgui.rs"

[[bin]]
name = "shoot"
path = "src/bin/shoot.rs"
required-features = ["capture"]

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"
required-features = ["capture"]
