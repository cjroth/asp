[package]
name = "asp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "asp_core"
path = "src/lib.rs"

# Always-on / wasm-safe dependencies (the full merge/fold/session engine).
[dependencies]
ed25519-dalek.workspace = true
rand_core.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
rmp-serde.workspace = true
similar.workspace = true
thiserror.workspace = true

# Native-only: the SQLite substrate, derived-git encoding (sha1/flate2/toml), TLS
# for wss://, and the tokio WebSocket driver (`net`) reused by the CLI and the
# desktop engine. Gated out of the wasm SDK surface (the wasm node keeps its
# log/blobs in memory and injects its own transport).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite.workspace = true
rustls.workspace = true
rcgen.workspace = true
sha1.workspace = true
flate2.workspace = true
toml.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
futures-util.workspace = true
notify.workspace = true
tracing.workspace = true

# The wasm build keeps the full merge/fold/session engine; it just needs the JS
# RNG backend for handshake nonces + random file ids (one engine, §Implementation).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
tempfile.workspace = true
