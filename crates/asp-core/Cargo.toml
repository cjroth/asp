[package]
name = "asp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "asp_core"
path = "src/lib.rs"

[dependencies]
ed25519-dalek.workspace = true
rand_core.workspace = true
rand.workspace = true
sha2.workspace = true
sha1.workspace = true
hex.workspace = true
base64.workspace = true
