[package]
name = "asp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "asp_core"
path = "src/lib.rs"

# Always-on / wasm-safe dependencies (the full merge/fold/session engine).
[dependencies]
ed25519-dalek.workspace = true
rand_core.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
rmp-serde.workspace = true
similar.workspace = true
thiserror.workspace = true

# Native-only: the SQLite substrate, derived-git encoding (sha1/flate2/toml), the
# iroh QUIC transport (`iroh_net`) + relay server, and the debounced filesystem
# watcher — reused by the CLI and the desktop engine. Gated out of the wasm SDK
# surface, which runs iroh-in-wasm (`iroh_wasm`) over a relay instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite.workspace = true
sha1.workspace = true
flate2.workspace = true
toml.workspace = true
anyhow.workspace = true
iroh.workspace = true
iroh-tickets.workspace = true
iroh-relay.workspace = true
n0-future.workspace = true
tokio.workspace = true
notify.workspace = true
tracing.workspace = true

# The wasm build keeps the full merge/fold/session engine; it just needs the JS
# RNG backend for handshake nonces + random file ids (one engine, §Implementation).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# iroh in the browser: relay-only transport (no UDP in the sandbox), no metrics.
# Requires RUSTFLAGS=--cfg getrandom_backend="wasm_js" at build time.
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1"
n0-future = "0.3"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tempfile.workspace = true
