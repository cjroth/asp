[package]
name = "asp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "asp_core"
path = "src/lib.rs"

# Always-on / wasm-safe dependencies (the full merge/fold/session engine).
[dependencies]
ed25519-dalek.workspace = true
rand_core.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes.workspace = true
rmp-serde.workspace = true
similar.workspace = true
thiserror.workspace = true
# git bridge read path (`gitimport`): pack decode + object parsing, wasm-safe.
gix-pack.workspace = true
gix-object.workspace = true
gix-hash.workspace = true
gix-features.workspace = true

# Native-only: the SQLite substrate, derived-git encoding (sha1/flate2/toml), the
# iroh QUIC transport (`iroh_net`) + relay server, and the debounced filesystem
# watcher — reused by the CLI and the desktop engine. Gated out of the wasm SDK
# surface, which runs iroh-in-wasm (`iroh_wasm`) over a relay instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite.workspace = true
sha1.workspace = true
flate2.workspace = true
toml.workspace = true
anyhow.workspace = true
iroh.workspace = true
iroh-tickets.workspace = true
iroh-relay.workspace = true
n0-future.workspace = true
tokio.workspace = true
notify.workspace = true
tracing.workspace = true
# git CORS proxy (`gitproxy`): hyper server + rustls-only reqwest upstream client.
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
reqwest.workspace = true
# git-bridge credentials (§8): resolve/persist HTTPS tokens via the OS keychain.
# All calls are best-effort — a missing/locked backend falls back to env/anonymous.
keyring = { workspace = true, features = ["apple-native", "windows-native", "sync-secret-service"] }
# Stream combinators for capping the upstream response body chunk-by-chunk (mirrors
# the wasm target's use below); default-features off keeps it to std stream utils.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# The wasm build keeps the full merge/fold/session engine; it just needs the JS
# RNG backend for handshake nonces + random file ids (one engine, §Implementation).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# The browser wall clock (Date.now, ms) — so a wasm node stamps real timestamps on
# its log rows (native uses SystemTime). Without this the timeline / PITR see epoch 0.
js-sys = "0.3"
# iroh in the browser: relay-only transport (no UDP in the sandbox), no metrics.
# Requires RUSTFLAGS=--cfg getrandom_backend="wasm_js" at build time.
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
iroh-tickets = "1"
n0-future = "0.3"
wasm-bindgen-futures = "0.4"
# Browser live connector: a spawn_local frame reader + merged-stream select over
# (inbound frames | locally-authored rows | connection-closed). The full futures
# crate isn't needed — just the unbounded channel and stream combinators.
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
