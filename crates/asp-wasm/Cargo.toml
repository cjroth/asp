[package]
name = "asp-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "WebAssembly bindings for asp-core — the thin-node surface (one engine everywhere)"

[lib]
name = "asp_wasm"
crate-type = ["cdylib", "rlib"]

# The SDK is NOT a reimplementation: there is exactly one protocol engine
# (asp-core). Compiled to wasm32, asp-core drops only the native SQLite/TLS via
# target gates — the full merge/fold/session engine is always on, so a plugin
# computes its own byte-identical state.
[dependencies]
asp-core = { path = "../asp-core" }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_json.workspace = true
hex.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
