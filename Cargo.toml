[workspace]
resolver = "2"
members = [
    "crates/asp-core",
    "crates/asp",
    "crates/asp-wasm",
    "desktop/engine",
    "tests/e2e",
]
default-members = [
    "crates/asp-core",
    "crates/asp",
]
# The Tauri shell links system webkit and is built with the Tauri toolchain, not
# plain `cargo --workspace`; keep it out of the workspace build/test graph.
exclude = [
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ASP contributors"]
rust-version = "1.89"

[workspace.dependencies]
# crypto / identity
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
# storage
rusqlite = { version = "0.31", features = ["bundled"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
toml = "0.8"
# merge
similar = "2"
# derived git
flate2 = "1"
# errors / utils
thiserror = "1"
anyhow = "1"
# cli
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
# async net (CLI driver)
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
futures-util = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "ring"] }
# watching
notify = "6"
walkdir = "2"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tests
tempfile = "3"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
