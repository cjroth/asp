[workspace]
resolver = "2"
members = [
    "crates/asp-core",
    "crates/asp",
    "crates/asp-wasm",
    "desktop/engine",
    "tests/e2e",
]
default-members = [
    "crates/asp-core",
    "crates/asp",
]
# The Tauri shell links system webkit and is built with the Tauri toolchain, not
# plain `cargo --workspace`; keep it out of the workspace build/test graph.
exclude = [
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.26"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ASP contributors"]
rust-version = "1.91"

[workspace.dependencies]
# crypto / identity
ed25519-dalek = { version = "2", default-features = false, features = ["std", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
# storage
rusqlite = { version = "0.31", features = ["bundled"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
toml = "0.8"
# merge
similar = "2"
# derived git
flate2 = "1"
# errors / utils
thiserror = "1"
anyhow = "1"
# git-bridge credentials: OS keychain (macOS Keychain / Secret Service / Windows
# Credential Manager). Native-only; the bridge falls back to env/anonymous when the
# platform store is unavailable, so a missing backend never panics (git-bridge §8).
keyring = "3"
# cli
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
# p2p transport (iroh: QUIC + NAT hole-punching + relay fallback; dial-by-key)
iroh = "1"
iroh-tickets = "1"
iroh-relay = { version = "1", default-features = false, features = ["server"] }
n0-future = "0.3"
# CLI: render a peer ticket as a scannable QR in the terminal
qrcode = { version = "0.14", default-features = false }
# async net (CLI driver)
tokio = { version = "1", features = ["full"] }
# git CORS proxy (native-only, co-hosted with the relay): a minimal HTTP server
# (hyper 1.x — already in the tree transitively via iroh, version-aligned) plus an
# rustls-only upstream client (reqwest, NOT native-tls). `stream` gives us a capped
# streaming response body; `resolve_to_addrs` pins DNS to a vetted IP (SSRF/rebinding).
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
# git bridge: packfile decode with delta resolution + object/oid parsing.
# Component crates only (never the `gix` facade); wasm-verified with exactly this
# feature set (R1 probe): `wasm` is mandatory for wasm32, `parallel` must stay off,
# zlib comes from gix-features (pure-Rust zlib-rs). Same config serves native + wasm.
gix-pack = { version = "0.72", default-features = false, features = ["streaming-input", "wasm", "sha1"] }
gix-object = { version = "0.62", default-features = false }
gix-hash = { version = "0.25", default-features = false, features = ["sha1"] }
gix-features = { version = "0.48", default-features = false, features = ["zlib"] }
# watching
notify = "6"
walkdir = "2"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# tests
tempfile = "3"

[profile.release]
opt-level = 2
lto = false
codegen-units = 16

# Dev builds (`bun dev`, `cargo test`) keep the workspace crates unoptimized for
# fast incremental compiles + debuggability, but the compute-heavy bits — content
# hashing (sha2), the merge/fold engine (asp-core), (de)serialization — run at
# debug speed otherwise, which is ~20x slower. On a big vault that turned the
# startup reconcile (hash every file) into tens of seconds in dev. Optimize just
# those packages; deps are compiled once and cached, so incremental dev builds of
# the app shell stay fast.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.asp-core]
opt-level = 3
