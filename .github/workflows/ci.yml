name: ci

# The headline gates are CI-blocking (§Testing): merge determinism + identity
# convergence, the multi-process e2e matrix, and the derived-git coherence check
# must all run green before any release.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Build (workspace)
        run: cargo build --workspace
      - name: Unit + conformance + multi-process e2e
        run: cargo test --workspace
      - name: Clippy (no warnings)
        run: rustup component add clippy && cargo clippy --workspace -- -D warnings
