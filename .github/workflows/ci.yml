name: ci

# The headline gates are CI-blocking (§Testing): merge determinism + identity
# convergence, the multi-process e2e matrix, and the derived-git coherence check
# must all run green before any release.
#
# Security posture: every third-party action is pinned to a full commit SHA (the
# trailing `# vX.Y.Z` is a human hint only — GitHub resolves the SHA, not the
# tag), and the workflow token is read-only (see `permissions:`).
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the repo.
permissions:
  contents: read

# One in-flight run per ref; new pushes cancel the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Harden against transient crates.io flakiness (the "[16] Error in the HTTP2
  # framing layer" download failures): retry, and force HTTP/1.1.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Build (workspace)
        run: cargo build --workspace
      # Deterministic tests (pure protocol/fold/merge/identity) run once, in
      # parallel. The networked, multi-process crates are split out below because
      # real iroh QUIC under parallel load has transient port/propagation races
      # (each test passes reliably in isolation) — running them serially and
      # retrying turns a flaky red into a stable signal WITHOUT masking a real
      # regression (a genuine break still fails all three serial attempts).
      - name: Unit + conformance (deterministic)
        run: cargo test --workspace --exclude asp-e2e --exclude asp-desktop-engine
      - name: Multi-process e2e (networked — serial, retried for iroh load-flakiness)
        run: |
          for attempt in 1 2 3; do
            if cargo test -p asp-e2e -p asp-desktop-engine -- --test-threads=1; then
              exit 0
            fi
            echo "::warning::networked tests attempt $attempt failed (likely a transient iroh/port race); retrying"
          done
          echo "::error::networked tests still failing after 3 serial attempts"
          exit 1
      - name: Clippy (no warnings, all targets incl. tests)
        run: rustup component add clippy && cargo clippy --workspace --all-targets -- -D warnings

  coverage:
    # Visibility gate: asp-core line coverage must stay above the floor, so the
    # cold integration seams (engine capture, net protocol) can't silently
    # regress as the engine grows. Informational per-file table in the log.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust + llvm-tools
        run: rustup toolchain install stable --profile minimal && rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@d0f4f69b07c0804d1003ca9a5a5f853423872ed9 # v2.62.13
        with:
          tool: cargo-llvm-cov
      - name: Coverage (floor enforced)
        run: ./scripts/coverage.sh

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust + wasm target
        run: rustup toolchain install stable --profile minimal && rustup target add wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - name: Install wasm-pack
        # Prebuilt binary via a maintained installer — the upstream
        # `curl … init.sh | sh` script flakes on GitHub release fetches.
        uses: taiki-e/install-action@d0f4f69b07c0804d1003ca9a5a5f853423872ed9 # v2.62.13
        with:
          tool: wasm-pack
      - name: Build native asp binary (for the parity e2e)
        run: cargo build -p asp
      - name: Build the one engine to wasm
        run: cd sdks/typescript && bun run build:wasm
      - name: SDK conformance (wasm == native) + parity (SDK ⇄ real asp)
        run: cd sdks/typescript && bun test
      - name: Obsidian plugin (path filter + plugin ⇄ real asp parity)
        run: cd plugins/obsidian && bun test
      - name: Obsidian plugin builds to a self-contained main.js
        # The release ships only main.js + manifest.json (the wasm engine is
        # inlined as base64), so a broken bundle must fail CI, not the tag.
        run: cd plugins/obsidian && bun install --frozen-lockfile && bun run build

      - name: Demo — mesh/persist/web-glue/UI + LIVE wss interop
        # Includes test:interop, which drives a demo node against a REAL
        # `asp watch --listen` peer and asserts the watch link stays LIVE and
        # pushes after catch-up. That test guards the live-link regression — it
        # must run in CI to protect main (it previously ran only locally). The
        # live-wss interop is networked, so it gets a couple retries (transient
        # connect/port race) while the deterministic demo tests run once.
        run: |
          cd demo && bun install && bun run build && bun run test
          for attempt in 1 2 3; do
            if bun run test:interop; then exit 0; fi
            echo "::warning::demo interop attempt $attempt failed (transient wss race); retrying"
          done
          echo "::error::demo interop still failing after 3 attempts"; exit 1
