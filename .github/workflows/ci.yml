name: ci

# The headline gates are CI-blocking (§Testing): merge determinism + identity
# convergence, the multi-process e2e matrix, and the derived-git coherence check
# must all run green before any release.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Harden against transient crates.io flakiness (the "[16] Error in the HTTP2
  # framing layer" download failures): retry, and force HTTP/1.1.
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
      - name: Build (workspace)
        run: cargo build --workspace
      - name: Unit + conformance + multi-process e2e
        run: cargo test --workspace
      - name: Clippy (no warnings, all targets incl. tests)
        run: rustup component add clippy && cargo clippy --workspace --all-targets -- -D warnings

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust + wasm target
        run: rustup toolchain install stable --profile minimal && rustup target add wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
      - name: Install wasm-pack
        # Prebuilt binary via a maintained installer — the upstream
        # `curl … init.sh | sh` script flakes on GitHub release fetches.
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Build native asp binary (for the parity e2e)
        run: cargo build -p asp
      - name: Build the one engine to wasm
        run: cd sdks/typescript && bun run build:wasm
      - name: SDK conformance (wasm == native) + parity (SDK ⇄ real asp)
        run: cd sdks/typescript && bun test
      - name: Obsidian plugin (path filter + plugin ⇄ real asp parity)
        run: cd plugins/obsidian && bun test
      - name: Obsidian plugin builds to a self-contained main.js
        # The release ships only main.js + manifest.json (the wasm engine is
        # inlined as base64), so a broken bundle must fail CI, not the tag.
        run: cd plugins/obsidian && bun install --frozen-lockfile && bun run build
