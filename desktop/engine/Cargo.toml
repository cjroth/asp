[package]
name = "asp-desktop-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Context Desktop engine — multi-vault manager linking asp-core natively (no Tauri dep; builds/tests on plain Linux)"

[lib]
name = "asp_desktop_engine"
path = "src/lib.rs"

[dependencies]
asp-core = { path = "../../crates/asp-core" }
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
# The hermetic git smart-HTTP fixture harness (a bare repo served by CGI-exec'ing
# `git http-backend`) — lets the git-bridge clone test run offline against a real
# git server. asp-e2e depends only on asp-core, so this adds no cycle.
asp-e2e = { path = "../../tests/e2e" }
